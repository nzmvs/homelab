apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  strategy: {}
  template:
    metadata:
      labels:
        app: nginx
    spec:
      volumes:
        - name: test-volume
          emptyDir:
            sizeLimit: 500Mi
        - name: configmap-volume
          configMap:
            name: test-config
      containers:
      - image: nginx:latest
        name: nginx
        volumeMounts:
          - mountPath: /opt/test-volume
            name: test-volume
          - mountPath: /opt/test-configmap-volume
            name: configmap-volume
