apiVersion: v1
kind: Pod
metadata:
  name: nginx
spec:
  volumes:
    - name: test-volume
      emptyDir:
        sizeLimit: 500Mi
  containers:
  - name: nginx
    image: nginx:1.14.2
    ports:
    - containerPort: 80
    volumeMounts:
      - mountPath: /opt/test-volume
        name: test-volume
