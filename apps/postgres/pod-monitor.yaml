apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pg
  namespace: postgres
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: pg
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
      relabelings:
        - targetLabel: cluster
          replacement: pg
        - targetLabel: monitored_service
          replacement: pg-backups
