apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pg-backup-alert-test
  namespace: postgres
  labels:
    release: monitoring
spec:
  groups:
  - name: pg-backup-alert-test
    rules:
    - alert: PostgreSQLBackupAlertTest
      expr: vector(1) == 1
      for: 1m
      labels:
        severity: info
        service: pg-backups
      annotations:
        summary: 'TEST: PostgreSQL backup alert delivery'
        description: Synthetic monitoring test. No actual backup failure.
