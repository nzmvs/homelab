apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: flux-system
spec:
  interval: 1h
  releaseName: plugin-barman-cloud
  targetNamespace: cnpg-system
  dependsOn:
    - name: cert-manager
    - name: cloudnative-pg
  chart:
    spec:
      chart: plugin-barman-cloud
      version: "0.8.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
