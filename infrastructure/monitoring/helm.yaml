apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  releaseName: monitoring
  targetNamespace: monitoring
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.11.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    fullnameOverride: monitoring
    grafana:
      enabled: false
    defaultRules:
      create: false
    kubeStateMetrics:
      enabled: false
    nodeExporter:
      enabled: false
    kubeApiServer:
      enabled: false
    kubelet:
      enabled: false
    kubeControllerManager:
      enabled: false
    coreDns:
      enabled: false
    kubeDns:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    prometheusOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
    prometheus:
      prometheusSpec:
        replicas: 1
        retention: 3d
        retentionSize: 4GB
        scrapeInterval: 60s
        evaluationInterval: 60s
        podMonitorSelector:
          matchLabels:
            release: monitoring
        ruleSelector:
          matchLabels:
            release: monitoring
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 5Gi
    alertmanager:
      alertmanagerSpec:
        replicas: 1
        useExistingSecret: true
        configSecret: alertmanager-telegram
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 1Gi
