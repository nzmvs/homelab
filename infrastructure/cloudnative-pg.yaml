apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 24h
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 1h
  releaseName: cloudnative-pg
  targetNamespace: cnpg-system
  install:
    createNamespace: true
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: flux-system
spec:
  interval: 1h
  releaseName: plugin-barman-cloud
  targetNamespace: cnpg-system
  dependsOn:
    - name: cert-manager
    - name: cloudnative-pg
  chart:
    spec:
      chart: plugin-barman-cloud
      version: "0.8.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
